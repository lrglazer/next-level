<meta charset="utf-8">
<title>Next Level Scout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* ===== Tokens (from tokens.json) ===== */
:root{
  --bg:#0B0C0E;--surface:#121418;--surface2:#191C21;--line:#272B32;--text:#ECEEF1;--text2:#A3A9B3;--text3:#868D98;
  --accent:#22A6FF;--onAccent:#0B0C0E;--hot:#FFE500;--ok:#3DDC84;--warn:#FFE500;--bad:#FF3355;
  --okSoft:transparent;--warnSoft:transparent;--badSoft:transparent;--accentSoft:transparent;
  --r-sm:4px;--r-md:6px;
  --f-display:'Teko','Arial Narrow',sans-serif;--f-ui:'Rubik','Helvetica Neue',Arial,sans-serif;--f-data:'Rubik','Helvetica Neue',Arial,sans-serif;--f-name:'Teko','Arial Narrow',sans-serif;--f-score:'Teko','Arial Narrow',sans-serif;
  --h-case:uppercase;--h-track:.02em;--name-size:30px;
  color-scheme:dark;
}
:root[data-dir="B"]{
  --bg:#F6F6F3;--surface:#FFFFFF;--surface2:#EFEFEA;--line:#DCDCD5;--text:#121416;--text2:#545A60;--text3:#666C72;
  --accent:#0A3A8C;--onAccent:#FFFFFF;--hot:#0A3A8C;--ok:#1B6E40;--warn:#8A5300;--bad:#B42318;
  --okSoft:#E4F1E8;--warnSoft:#FBF0DC;--badSoft:#FBE7E5;--accentSoft:#E6ECF7;
  --r-sm:3px;--r-md:4px;
  --f-display:'Archivo Narrow','Arial Narrow',sans-serif;--f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;--f-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;--f-name:'Source Serif 4',Georgia,serif;
  --h-case:none;--h-track:0;--name-size:30px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--f-display);text-transform:var(--h-case);letter-spacing:var(--h-track);font-weight:700}
h1{font-size:28px;line-height:1.1}
h2{font-size:18px;line-height:1.2}
.lab{font:600 11px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
a{color:var(--accent)}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.brand svg{flex:none}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-sm);border:0;background:none;width:100%;text-align:left;cursor:pointer;color:var(--text2);font-weight:500}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav[aria-current="page"]{background:var(--surface2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav .ct{margin-left:auto;font:500 11px var(--f-data);color:var(--text3)}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12px;color:var(--text2)}
.side .foot b{display:block;color:var(--text);font-weight:600}
.top{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top .search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text3)}
.top .search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text)}
.dirsw{display:none!important;margin-left:auto;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.dirsw button{height:32px;padding:0 12px;border:0;background:var(--surface);cursor:pointer;color:var(--text2);font-weight:600;font-size:12px;white-space:nowrap}
.dirsw button[aria-pressed="true"]{background:var(--accent);color:var(--onAccent)}
main{padding:24px;min-width:0}
.ph{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph p{margin:4px 0 0;color:var(--text2)}

/* ===== Primitives ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>.bd{padding:16px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--text3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:2px;font:600 11px/1 var(--f-ui);letter-spacing:.03em;border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor;background:var(--okSoft)}
.chip.warn{color:var(--warn);border-color:currentColor;background:var(--warnSoft)}
.chip.bad{color:var(--bad);border-color:currentColor;background:var(--badSoft)}
.chip.acc{color:var(--accent);border-color:currentColor;background:var(--accentSoft)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--text3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.ath{display:flex;align-items:center;gap:10px}
.ini{width:30px;height:30px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--f-data);color:var(--text2);flex:none}
.ath b{font-weight:600}
.ath small{display:block;color:var(--text3);font-size:12px}
.vf{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font:600 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.uv{display:inline-flex;align-items:center;gap:3px;color:var(--warn);font:600 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.kpi div{padding:14px 16px;border-right:1px solid var(--line)}
.kpi div:last-child{border-right:0}
.kpi b{display:block;font:500 28px/1.1 var(--f-data);margin-top:6px}
.kpi b.h{color:var(--hot)}
.kpi span.d{font:500 12px var(--f-data);color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px}
.skel{height:14px;border-radius:2px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{padding:40px 16px;text-align:center;color:var(--text2)}
.empty h3{color:var(--text);font-size:16px;margin-bottom:6px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r-sm);background:var(--warnSoft);font-size:13px}
.banner.bad{border-left-color:var(--bad);background:var(--badSoft)}
.banner.ok{border-left-color:var(--ok);background:var(--okSoft)}
.banner b{font-weight:600}

/* filters */
.layout-search{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.filters{padding:0}
.fg{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.fg:last-child{border-bottom:0}
.fg select,.fg input[type=number],.fg input[type=text]{height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 8px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{height:26px;padding:0 8px;border:1px solid var(--line);border-radius:2px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.tog input{width:16px;height:16px;accent-color:var(--accent)}
.star{border:0;background:none;cursor:pointer;color:var(--text3);padding:4px;display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--hot)}

/* profile */
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start;padding:20px;border-bottom:1px solid var(--line)}
.pava{width:84px;height:84px;border-radius:var(--r-md);background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:500 24px var(--f-data);color:var(--text2)}
.pname{font:700 var(--name-size)/1.05 var(--f-name);text-transform:var(--h-case);letter-spacing:var(--h-track)}
.pmeta{color:var(--text2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.meas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line)}
.meas div{padding:12px 16px;border-right:1px solid var(--line)}
.meas div:last-child{border-right:0}
.meas b{display:block;font:500 20px/1.2 var(--f-data);margin:4px 0 2px}
.film{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.clip{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0}
.clip .fr{aspect-ratio:16/9;position:relative;background:#0F1A12}
:root[data-dir="B"] .clip .fr{background:#1D2A22}
.clip .fr svg{position:absolute;inset:0;width:100%;height:100%}
.clip .tc{position:absolute;right:6px;bottom:6px;font:500 11px var(--f-data);color:#fff;background:rgba(0,0,0,.65);padding:2px 5px;border-radius:2px}
.clip .cap{padding:8px 10px;font-size:12px}
.clip .cap b{display:block;font-weight:600;font-size:13px}
.clip .cap span{color:var(--text3)}
.tl{display:grid;gap:0}
.tl div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.tl div:last-child{border-bottom:0}
.tl span{font:500 12px var(--f-data);color:var(--text3)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:8px;resize:vertical}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-height:320px;display:flex;flex-direction:column}
.col .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.col .hd h3{font-size:15px}
.col .hd span{font:500 12px var(--f-data);color:var(--text3)}
.col .bd{padding:8px;display:grid;gap:8px;align-content:start;flex:1}
.col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.card{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--bg);display:grid;gap:6px;cursor:grab}
.card .t{display:flex;justify-content:space-between;gap:6px;align-items:start}
.card b{font-weight:600}
.card small{color:var(--text3);font-size:12px}
.card select{height:26px;font-size:12px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}

/* compare */
.cmp td,.cmp th{white-space:normal}
.cmp td.best{color:var(--ok);font-weight:600}
.cmp th[scope=row]{text-transform:none;letter-spacing:0;font:500 13px var(--f-ui);color:var(--text2);width:180px}

/* messages */
.msgs{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:520px}
.thr{border-right:1px solid var(--line)}
.thr button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;cursor:pointer}
.thr button[aria-current="true"]{background:var(--surface2);box-shadow:inset 2px 0 0 var(--accent)}
.thr b{font-weight:600}
.thr small{grid-column:1/-1;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thr time{font:500 11px var(--f-data);color:var(--text3)}
.conv{display:flex;flex-direction:column}
.conv .log{flex:1;padding:16px;display:grid;gap:10px;align-content:start}
.bub{max-width:70%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px}
.bub.me{justify-self:end;background:var(--surface2)}
.bub time{display:block;font:500 10px var(--f-data);color:var(--text3);margin-top:4px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;min-width:0}

/* builder */
.bld{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frm label{display:grid;gap:6px;font-size:12px;color:var(--text2);font-weight:500}
.frm input,.frm select{height:34px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;color:var(--text)}
.frm .full{grid-column:1/-1}
.meter{height:6px;background:var(--surface2);border-radius:1px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.chk{display:grid;gap:6px;font-size:13px}
.chk div{display:flex;gap:8px;align-items:center}
.chk .y{color:var(--ok)}.chk .n{color:var(--text3)}

/* ===== Social layer ===== */
.feedwrap>*{min-width:0}
.gd{max-width:100%}
.rail>*,.stack>*,.grid2>*{min-width:0}
.panel>.hd{flex-wrap:wrap}
.feedwrap{display:grid;grid-template-columns:minmax(0,640px) 300px;gap:24px;align-items:start;justify-content:center}
.gd{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.gd button{border:0;background:none;display:grid;justify-items:center;gap:6px;cursor:pointer;flex:none;width:68px;padding:0}
.gd .ring{width:60px;height:60px;border-radius:50%;padding:2px;border:2px solid var(--line);display:grid;place-items:center}
.gd .ring.live{border-color:var(--bad)}
.gd .ring.new{border-color:var(--accent)}
.gd .ring span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);letter-spacing:.04em;color:#fff}
.gd small{font-size:11px;color:var(--text2);max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd .lv{font:700 9px var(--f-ui);letter-spacing:.08em;color:var(--bad)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.post+.post{margin-top:12px}
.post .ph2{display:flex;gap:10px;align-items:center;padding:12px 14px}
.post .ph2 b{font-weight:600}
.post .ph2 small{display:block;color:var(--text3);font-size:12px}
.post .body{padding:0 14px 12px;font-size:14px}
.post .body p{margin:0}
.tag{color:var(--accent);font-weight:600;cursor:pointer}
.post .media{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.post .acts2{display:flex;gap:2px;padding:4px 8px;border-top:1px solid var(--line)}
.post .acts2 button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;background:none;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;border-radius:var(--r-sm)}
.post .acts2 button:hover{background:var(--surface2);color:var(--text)}
.post .acts2 button[aria-pressed="true"]{color:var(--accent)}
.post .acts2 .sp{margin-left:auto}
.cmts{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px;font-size:13px}
.cmts form{display:flex;gap:6px}
.cmts input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 8px}
.rp{padding:8px 14px 0;font-size:12px;color:var(--text3);display:flex;gap:6px;align-items:center}
.annc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;padding:22px 20px;min-height:200px;position:relative;overflow:hidden;color:#fff}
.annc .stripe{position:absolute;right:-30px;top:0;bottom:0;width:120px;transform:skewX(-14deg)}
.annc .k{font:700 12px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:relative}
.annc h3{font:700 44px/0.95 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:6px 0;position:relative}
.annc .s{font:500 13px var(--f-ui);position:relative;opacity:.9}
.annc .mk{position:relative;width:64px;height:64px;border:3px solid #fff;display:grid;place-items:center;font:700 24px 'Barlow Condensed',sans-serif}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:16px 14px}
.score .tm{display:grid;gap:4px;min-width:0}
.score .tm b{overflow-wrap:anywhere}
.score .tm b{font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.score .pts{font:500 40px/1 var(--f-data);font-variant-numeric:tabular-nums}
.score .mid{text-align:center;font:600 12px var(--f-ui);color:var(--bad);letter-spacing:.06em}
.sline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.sline div{padding:10px 14px;border-right:1px solid var(--line)}
.sline div:last-child{border-right:0}
.sline b{display:block;font:500 18px var(--f-data)}
.rail{display:grid;gap:16px;position:sticky;top:72px}
.sug{display:grid;gap:0}
.sug>div{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sug>div:last-child{border-bottom:0}
.sug .ath{flex:1;min-width:0}
.sug .ath small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
@media (max-width:980px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pgrid button{aspect-ratio:1;border:0;padding:0;position:relative;cursor:pointer;overflow:hidden;background:var(--surface2)}
.pgrid button svg{position:absolute;inset:0;width:100%;height:100%}
.pgrid .lbl{position:absolute;left:6px;bottom:6px;font:600 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.6);padding:2px 5px}
.ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dt{border:1px solid var(--line);border-radius:var(--r-sm);text-align:center;padding:6px 0}
.ev .dt b{display:block;font:500 22px/1 var(--f-data)}
.ev .dt span{font:600 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.ev h3{font-size:16px}
.ev p{margin:2px 0 0;color:var(--text2);font-size:13px}
.faces{display:flex;margin-top:6px}
.faces span{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);background:var(--surface2);display:grid;place-items:center;font:600 8px var(--f-data);color:var(--text2);margin-left:-6px}
.faces span:first-child{margin-left:0}
.prog-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px;border-bottom:1px solid var(--line)}

function compare(){
  const list=state.cmp.map(id=>A.find(a=>a.id===id)).filter(Boolean);
  const pool=A.filter(a=>state.star.includes(a.id)&&!state.cmp.includes(a.id));
  const rows=[['Position',a=>a.pos],['Class',a=>a.yr],['Height',a=>a.ht],['Weight (lb)',a=>a.wt,'max'],['40 yd (s)',a=>a.forty,'min'],['Vertical (in)',a=>a.vert,'max'],['Pro shuttle (s)',a=>a.shuttle,'min'],['GPA',a=>a.gpa,'max'],['SAT',a=>a.sat,'max'],['Offers',a=>a.off,'max'],['Season',a=>statStr(a)],['Data',a=>a.v?'Verified':'Self-reported'],['Contact',a=>contact(a).label]];
  $('#main').innerHTML=`<div class="ph"><div><h1>Compare</h1><p>Up to three athletes. Best value in each row is highlighted.</p></div>
  <div style="display:flex;gap:8px;align-items:center"><select class="btn" id="addc" ${list.length>=3||!pool.length?'disabled':''}><option value="">${pool.length?'Add from shortlist…':'Shortlist is empty'}</option>${pool.map(a=>`<option value="${a.id}">${nm(a)} · ${a.pos}</option>`).join('')}</select></div></div>
  ${list.length<2?'<div class="panel empty"><h3>Pick at least two athletes</h3><p>Star athletes in search, then add them here from your shortlist.</p><button class="btn pri" data-v="search">Go to search</button></div>':
  `<div class="panel tablewrap"><table class="cmp"><thead><tr><th></th>${list.map(a=>`<th style="text-transform:none;letter-spacing:0"><div class="ath"><span class="ini">${ini(a)}</span><div><b style="font:700 16px var(--f-name);color:var(--text)">${nm(a)}</b><small>${a.hs}</small></div></div><button class="btn sm" data-rm="${a.id}" style="margin-top:8px">Remove</button></th>`).join('')}</tr></thead><tbody>
  ${rows.map(([l,fn,best])=>{const vals=list.map(fn);let b=null;if(best){const nums=vals.filter(v=>v!=null);b=best==='min'?Math.min(...nums):Math.max(...nums)}return `<tr style="cursor:default"><th scope="row">${l}</th>${vals.map(v=>`<td class="${best?'num':''} ${best&&v===b?'best':''}">${v==null?'—':(typeof v==='number'&&l.includes('(s)')?v.toFixed(2):v)}</td>`).join('')}</tr>`}).join('')}
  </tbody></table></div>`}`;
  const ac=$('#addc');if(ac)ac.onchange=e=>{if(e.target.value){state.cmp=[...state.cmp,+e.target.value].slice(-3);save();renderNav();compare()}};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{state.cmp=state.cmp.filter(x=>x!==+b.dataset.rm);save();renderNav();compare()});
}

const tdot=(k,sz=36)=>{const t=T[k];return `<span class="crest" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px;background:${t.c[0]};box-shadow:inset 0 -3px 0 ${t.c[1]}">${t.s}</span>`};

function author(by){

  if(p.k==='verify'){return `<div class="media"><div class="sline" style="border-top:0;grid-template-columns:repeat(3,minmax(0,1fr))">${p.ver.map(([l,v])=>`<div><span class="lab">${l}</span><b style="font-size:26px;color:var(--hot)">${v}</b><span class="vf">${ic('chk',11)}Verified</span></div>`).join('')}</div></div>`}
  if(p.k==='camp'){return `<div class="media"><div class="sline" style="border-top:0">${p.line.map(([l,v])=>`<div><span class="lab">${l}</span><b>${v}</b></div>`).join('')}</div></div>`}
  if(p.k==='need'){return `<div class="media"><div class="tablewrap"><table><thead><tr><th>Position</th><th>Class</th><th>Status</th></tr></thead><tbody>${p.needs.map(n=>`<tr style="cursor:default"><td><b>${n[0]}</b></td><td class="num">${n[1]}</td><td><span class="chip ${n[2].includes('spot')?'acc':''}">${n[2]}</span></td></tr>`).join('')}</tbody></table></div></div>`}

function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;z-index:30';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1600)}
const folBtn=k=>`<button class="btn sm ${state.follow.includes(k)?'':'pri'}" data-fol="${k}">${state.follow.includes(k)?'Following':'Follow'}</button>`;

function tile(p,a){
  const L=({live:'Live',commit:'Commit',offer:'Offer',verify:'Verified',film:'Film',camp:'Camp',recap:'Recap',roster:'Spotlight',repost:'Repost',need:'Needs',sched:'Schedule'})[p.k];
  let bg='#0F1A12',big='',sm='';
  if(p.k==='commit'||p.k==='offer'){bg=T[p.team].c[0];big=T[p.team].s;sm=p.k==='commit'?'Committed':'Offer'}
  else if(p.k==='verify'){bg='#111418';big=p.ver[0][1];sm=p.ver[0][0]+' verified'}
  else if(p.k==='camp'){bg='#111418';big=p.line[0][1];sm=p.line[0][0]+' · camp'}
  else if(p.k==='live'||p.k==='recap'){const g=p.live||p.fin;bg='#111418';big=g.h[1]+'–'+g.a[1];sm=p.live?'Live':'Final'}
  else if(p.k==='roster'){bg='#111418';big=a.pos;sm='Spotlight'}
  const inner=big?`<span style="position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:2px;color:#fff"><b style="font:500 clamp(18px,3vw,30px)/1 var(--f-data)">${big}</b><small style="font:600 10px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;opacity:.8">${sm}</small></span>`:field(p.id+3);
  return `<button data-gopost="${p.id}" aria-label="${L} post" style="background:${bg}">${inner}<span class="lbl">${L}</span></button>`;

/* ===== Feed ===== */
const NEEDS=['CB','LB','TE','WR'];
function feed(){
  const f=state.ff;
  let list=POSTS.filter(p=>{
    if(state.feedTeam){return (p.by[0]==='t'&&p.by[1]===state.feedTeam)||(p.live&&p.live.h[0]===state.feedTeam)||(p.fin&&p.fin.h[0]===state.feedTeam)}
    if(f==='follow')return p.by[0]==='t'?state.follow.includes(p.by[1]):p.by[0]==='a'?state.follow.includes('a'+p.by[1]):true;
    if(f==='needs')return (p.tags||[]).some(id=>NEEDS.includes(A.find(a=>a.id===id).pos))||p.k==='need';
    if(f==='ver')return p.k==='verify'||(p.tags||[]).every(id=>A.find(a=>a.id===id).v);
    return true});
  const sugA=A.filter(a=>!state.follow.includes('a'+a.id)&&NEEDS.includes(a.pos)&&a.v).slice(0,4);
  $('#main').innerHTML=`<div class="feedwrap"><div>
   <section class="panel" aria-label="Game Day"><div class="hd" style="padding:10px 16px"><h2>Game day</h2><span class="lab">Tonight & this week</span></div>
    <div class="gd">${STORIES.map(([k,s])=>`<button data-story="${k}" aria-pressed="${state.feedTeam===k}"><span class="ring ${s==='LIVE'?'live':s==='NEW'?'new':''}"><span style="background:${T[k].c[0]};box-shadow:inset 0 -4px 0 ${T[k].c[1]}">${T[k].s}</span></span><small>${T[k].n.split(' ')[0]}</small>${s?`<span class="lv" style="color:${s==='LIVE'?'var(--bad)':'var(--accent)'}">${s}</span>`:''}</button>`).join('')}</div></section>
   <div class="fchips" role="group" aria-label="Feed filter">${state.feedTeam?`<button class="btn sm pri" id="clrteam">${T[state.feedTeam].n} ✕</button>`:[['all','For you'],['follow','Following'],['needs','My recruiting needs'],['ver','Verified only']].map(([k,l])=>`<div class="seg"><button data-ff="${k}" aria-pressed="${f===k}">${l}</button></div>`).join('')}</div>
   ${list.length?list.map(p=>postHTML(p,openC.has(p.id))).join(''):'<div class="panel empty"><h3>Nothing here yet</h3><p>Follow more athletes and programs to fill your feed.</p><button class="btn pri" data-v="discover">Find people to follow</button></div>'}
  </div>
  <aside class="rail">
   <section class="panel"><div class="hd"><h2>Matches your needs</h2><span class="lab">${NEEDS.join(' · ')}</span></div><div class="sug">${sugA.map(a=>`<div><div class="ath" data-open="${a.id}" style="cursor:pointer"><span class="ini">${ini(a)}</span><div style="min-width:0"><b>${nm(a)}</b><small>${a.pos} · ${a.yr} · ${fmt(a.forty)} 40</small></div></div>${folBtn('a'+a.id)}</div>`).join('')}</div></section>
   <section class="panel"><div class="hd"><h2>Programs to follow</h2></div><div class="sug">${['bri','nps','clt'].map(k=>`<div><div class="ath" data-team="${k}" style="cursor:pointer">${tdot(k,30)}<div style="min-width:0"><b>${T[k].n}</b><small>${T[k].ty}</small></div></div>${folBtn(k)}</div>`).join('')}</div></section>
   <section class="panel"><div class="hd"><h2>Upcoming</h2><button class="btn sm" data-v="events">All events</button></div><div class="bd tl">${EVENTS.slice(0,3).map(e=>`<div><span>${e.d.join(' ')}</span><p style="margin:0"><b>${e.n}</b><br><span style="color:var(--text3);font:400 12px var(--f-ui)">${e.att.filter(id=>state.board[id]).length} of your board attending</span></p></div>`).join('')}</div></section>
  </aside></div>`;
  document.querySelectorAll('[data-ff]').forEach(b=>b.onclick=()=>{state.ff=b.dataset.ff;feed()});
  document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{state.feedTeam=state.feedTeam===b.dataset.story?null:b.dataset.story;feed()});

}

// Original sport artwork drawn in SVG (no photos), so every tile looks like a moment from that sport.
function art(sport,seed,label){
  const pal={Volleyball:['#0E2A47','#22A6FF','#FFE500'],Football:['#0F2A1A','#3DDC84','#ECEEF1'],Basketball:['#2A140C','#FF8A3D','#ECEEF1'],'Track & Field':['#2A0F14','#FF3355','#ECEEF1'],Soccer:['#0F2A22','#3DDC84','#FFE500'],Golf:['#13261A','#7BE495','#ECEEF1'],Softball:['#1E1A0C','#FFE500','#FF3355']}[sport]||['#16181D','#22A6FF','#ECEEF1'];
  const [bg,a,c]=pal,r=n=>{const x=Math.sin(seed*12.9898+n*78.233)*43758.5453;return x-Math.floor(x)};
  let g='';
  if(sport==='Volleyball')g=`<rect x="0" y="150" width="300" height="150" fill="${a}" opacity=".18"/><line x1="0" y1="150" x2="300" y2="150" stroke="${c}" stroke-width="3"/><rect x="40" y="90" width="220" height="60" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>${(()=>{const x=90+r(1)*120,y=58+r(2)*30;return `<circle cx="${x}" cy="${y}" r="24" fill="${c}"/><path d="M${x} ${y-24}Q${x+12} ${y} ${x} ${y+24}M${x-22} ${y-9}Q${x} ${y-1} ${x+22} ${y-9}M${x-22} ${y+9}Q${x} ${y+1} ${x+22} ${y+9}" stroke="${bg}" stroke-width="2" fill="none" opacity=".55"/>`})()}`;
  else if(sport==='Football')g=Array.from({length:7},(_,i)=>`<line x1="${i*50}" y1="0" x2="${i*50-60}" y2="300" stroke="${c}" stroke-width="2" opacity=".35"/>`).join('')+`<ellipse cx="${150+r(3)*40}" cy="${140+r(4)*30}" rx="44" ry="26" fill="#8A4B22" transform="rotate(-25 150 150)"/><path d="M128 142h44M140 134v16M150 134v16M160 134v16" stroke="${c}" stroke-width="2.5" transform="rotate(-25 150 150)"/>`;
  else if(sport==='Basketball')g=`<circle cx="150" cy="300" r="120" fill="none" stroke="${c}" stroke-width="2" opacity=".4"/><rect x="110" y="40" width="80" height="54" fill="none" stroke="${c}" stroke-width="3"/><ellipse cx="150" cy="110" rx="30" ry="7" fill="none" stroke="${a}" stroke-width="5"/><circle cx="${120+r(5)*60}" cy="${170+r(6)*40}" r="26" fill="${a}"/><path d="M${94+r(5)*60} ${170+r(6)*40}h52M${120+r(5)*60} ${144+r(6)*40}v52" stroke="${bg}" stroke-width="2"/>`;
  else if(sport==='Track & Field')g=Array.from({length:6},(_,i)=>`<path d="M-20 ${200+i*22}Q150 ${120+i*22} 320 ${200+i*22}" stroke="${c}" stroke-width="2" fill="none" opacity="${.25+i*.08}"/>`).join('')+`<rect x="0" y="0" width="300" height="300" fill="url(#sp${seed})" opacity=".0"/><path d="M${60+r(7)*60} 60l70 40-70 40" fill="none" stroke="${a}" stroke-width="8" stroke-linejoin="round"/>`;
  else if(sport==='Soccer')g=`<rect x="70" y="60" width="160" height="80" fill="none" stroke="${c}" stroke-width="3"/>${Array.from({length:8},(_,i)=>`<line x1="${70+i*20}" y1="60" x2="${70+i*20}" y2="140" stroke="${c}" opacity=".3"/>`).join('')}<circle cx="${130+r(8)*50}" cy="210" r="24" fill="${c}"/><path d="M${122+r(8)*50} 202l8 -4 8 4 -3 9h-10z" fill="${bg}"/>`;
  else if(sport==='Golf')g=`<ellipse cx="150" cy="230" rx="160" ry="60" fill="${a}" opacity=".3"/><line x1="170" y1="90" x2="170" y2="215" stroke="${c}" stroke-width="3"/><path d="M170 90l46 16-46 16z" fill="#FF3355"/><circle cx="${110+r(9)*30}" cy="226" r="7" fill="${c}"/>`;
  else g=`<path d="M150 40l18 50h-36z" fill="${a}"/><circle cx="150" cy="170" r="40" fill="none" stroke="${c}" stroke-width="3"/>`;
  return `<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="300" fill="${bg}"/><radialGradient id="gl${seed}" cx="${30+r(10)*40}%" cy="20%" r="80%"><stop offset="0" stop-color="${a}" stop-opacity=".45"/><stop offset="1" stop-color="${bg}" stop-opacity="0"/></radialGradient><rect width="300" height="300" fill="url(#gl${seed})"/>${g}${label?`<text x="16" y="284" font-family="var(--f-display)" font-size="64" font-weight="700" fill="${c}" opacity=".12">${label}</text>`:''}</svg>`;
}

    :`<div class="sched">${TEAM.sched.map(s=>{const w=/^W/.test(s[2]),l=/^L/.test(s[2]);return `<div class="srow"><span class="lab">${s[0]}</span><b>${s[1]}</b><span class="res ${w?'w':l?'l':'up'}">${s[2]}</span></div>`}).join('')}</div>`}</div></section><div id="pv"></div>`;
  document.querySelectorAll('[data-ttab]').forEach(b=>b.onclick=()=>{state.ttab=b.dataset.ttab;team()});

function athSheet(id){

  const posts=LP.filter(p=>p.by===id);

   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="asf">${(a.live?window.NLAPI.follows(id):(state.follow||[]).includes('a'+id))?ic('chk',13)+' Following':'Follow'}</button><button class="btn" ${a.live?'id="asm"':'data-v="messages"'}>Message</button>${a.live?'<button class="btn" id="asr">Report or block</button>':''}</div>
   ${posts.length?`<div class="sgrid">${posts.map(p=>tile(p)).join('')}</div>`:'<div class="empty"><p>No posts yet.</p></div>'}</div></div></div>`;
  $('#asx').onclick=()=>box.innerHTML='';
  if(a.live){$('#asf').onclick=()=>NLAPI.follow(id).then(()=>athSheet(id)).catch(e=>toast(e.message));$('#asm').onclick=()=>{box.innerHTML='';NLAPI.message(id).catch(e=>toast(e.message))};$('#asr').onclick=()=>NLAPI.reportUser(a,()=>{box.innerHTML=''});return}
  $('#asf').onclick=()=>{const f=state.follow||[];state.follow=f.includes('a'+id)?f.filter(x=>x!=='a'+id):[...f,'a'+id];athSheet(id)};
}
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('scrim')){const c=e.target.parentElement;if(c){const csx=c.querySelector('#csx');csx?csx.click():c.innerHTML=''}return}});

function nil(){
  const f=state.nilf||(state.nilf={sp:'',cat:'',min:0,q:''});
  let list=CA.filter(a=>(!f.sp||a.sp===f.sp)&&(!f.cat||a.open.includes(f.cat))&&a.fol>=f.min&&(!f.q||(nm(a)+' '+a.sch).toLowerCase().includes(f.q.toLowerCase())));
  list.sort((a,b)=>b.fol*b.eng-a.fol*a.eng);
  const sports=[...new Set(CA.map(a=>a.sp))];
  $('#main').innerHTML=`<div class="ph"><div><div class="lab">NIL marketplace · brands</div><h1>Find athletes for your brand</h1><p>Enrolled college athletes only. Every offer runs through built-in compliance before it reaches the athlete.</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip acc">${ic('shield',12)} Compliance on</span><span class="chip">Your brand: ${(window.NLAPI&&NLAPI.brandName())||'Peak Pulse Energy'}</span></div></div>
  <div class="nilstats">${[['Athletes open to deals',CA.length*1240],['Avg. engagement',(CA.reduce((s,a)=>s+a.eng,0)/CA.length).toFixed(1)+'%'],['Deals cleared this month','3,418'],['Median deal','$450']].map(([l,v])=>`<div class="panel"><div class="bd"><div class="lab">${l}</div><div class="num big">${typeof v==='number'?v.toLocaleString():v}</div></div></div>`).join('')}</div>
  <section class="panel" style="margin-top:16px"><div class="hd"><h2>Your campaigns</h2><button class="btn sm pri" id="newCamp">Post a campaign</button></div><div class="bd">${campList(true)}</div></section>
  <section class="panel" style="margin-top:16px"><div class="hd" style="gap:10px">
   <input id="nq" placeholder="Search name or school" value="${f.q}" style="flex:1;min-width:160px">
   <select id="nsp"><option value="">All sports</option>${sports.map(s=>`<option${f.sp===s?' selected':''}>${s}</option>`).join('')}</select>
   <select id="ncat"><option value="">Any category</option>${CATS.map(s=>`<option${f.cat===s?' selected':''}>${s}</option>`).join('')}</select>
   <select id="nmin">${[[0,'Any audience'],[10000,'10K+'],[25000,'25K+'],[50000,'50K+']].map(([v,l])=>`<option value="${v}"${f.min==v?' selected':''}>${l}</option>`).join('')}</select></div>
   <div class="nilgrid">${list.length?list.map(a=>`<article class="nilcard"><div class="ath"><span class="ini">${ini(a)}</span><div style="min-width:0"><b>${nm(a)} ${a.verified?`<span class="vchk" title="School-verified enrollment">${ic('chk',11)}</span>`:''}</b><small>${a.sp} · ${a.pos} · ${a.yr} · ${a.sch}</small></div></div>
     <div class="nilnums"><div><span class="lab">Followers</span><b class="num">${kfmt(a.fol)}</b></div><div><span class="lab">Engagement</span><b class="num">${a.eng}%</b></div><div><span class="lab">Deals</span><b class="num">${a.deals}</b></div></div>
     <div class="rates"><span>Story <b class="num">${money(a.rate[0])}</b></span><span>Post <b class="num">${money(a.rate[1])}</b></span><span>Appearance <b class="num">${money(a.rate[2])}</b></span></div>
     <div class="cats">${a.open.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
     ${a.intl?`<p class="warn">${ic('shield',12)} International student: US NIL income is generally restricted by visa rules. Offers are paused.</p>`:''}
     <div style="display:flex;gap:8px;margin-top:auto"><button class="btn pri" data-offer="${a.id}" ${a.intl?'disabled':''}>Send offer</button><button class="btn" data-save="${a.id}">${(state.nilsave||[]).includes(a.id)?ic('chk',13)+' Saved':'Save to list'}</button></div></article>`).join(''):'<div class="empty"><h3>No athletes match</h3><p>Try a different sport or a smaller audience size.</p></div>'}</div></section>
  <div id="offerDlg"></div>`;
  const upd=()=>{f.q=$('#nq').value;f.sp=$('#nsp').value;f.cat=$('#ncat').value;f.min=+$('#nmin').value;nil();const q=$('#nq');q.focus();q.setSelectionRange(q.value.length,q.value.length)};
  $('#newCamp').onclick=()=>{$('#offerDlg').innerHTML=`<div class="scrim" role="dialog" aria-modal="true"><div class="panel dlg"><div class="hd"><h2>Post a campaign</h2><button class="btn sm" id="ncx">Close</button></div><div class="bd stack" style="gap:12px">
    <label class="fl">Campaign name<input id="cn" value="Holiday Hydration"></label><label class="fl">What athletes do<input id="cd" value="1 reel featuring the product"></label>
    <label class="fl">Pay per athlete<input id="cpay" value="$400"></label><label class="fl">Spots<input id="cs" type="number" value="8" min="1"></label>
    <label class="fl">Who can apply<select id="cw"><option>Any sport · 5K+ followers</option><option>Fall sports · 10K+ followers</option><option>Women's sports only</option></select></label>
    <p class="note">${ic('shield',12)} Every applicant is pre-checked: enrolled, allowed category, fair market value.</p><button class="btn pri" id="cgo">Post campaign</button></div></div></div>`;
    $('#ncx').onclick=()=>$('#offerDlg').innerHTML='';
    $('#cgo').onclick=()=>{const s=+$('#cs').value||1;if(window.NLAPI&&NLAPI.on){NLAPI.campaign({title:$('#cn').value,del:$('#cd').value,pay:$('#cpay').value,spots:s,need:$('#cw').value}).then(()=>{$('#offerDlg').innerHTML='';nil()}).catch(e=>toast(e.message));return}CAMPS.unshift({id:Date.now(),brand:'Peak Pulse Energy',cat:'Food & drink',title:$('#cn').value||'New campaign',pay:$('#cpay').value,spots:s,left:s,need:$('#cw').value,del:$('#cd').value,due:'Just posted'});$('#offerDlg').innerHTML='';nil()}};
  $('#nq').oninput=upd;['#nsp','#ncat','#nmin'].forEach(s=>$(s).onchange=upd);
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=+b.dataset.save,s=state.nilsave||(state.nilsave=[]);state.nilsave=s.includes(id)?s.filter(x=>x!==id):[...s,id];save2();nil()});
  document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>offerFlow(CA.find(a=>a.id===+b.dataset.offer)));
}
function offerFlow(a){
  const box=$('#offerDlg');
  box.innerHTML=`<div class="scrim" role="dialog" aria-modal="true" aria-label="Send NIL offer"><div class="panel dlg"><div class="hd"><h2>Offer to ${nm(a)}</h2><button class="btn sm" id="ox">Close</button></div><div class="bd stack" style="gap:12px">
   <label class="fl">Brand category<select id="ocat">${[...CATS,...BANNED].map(c=>`<option>${c}</option>`).join('')}</select></label>
   <label class="fl">Deliverables<select id="odel"><option value="0">1 story</option><option value="1" selected>1 feed post or reel</option><option value="2">In-person appearance</option></select></label>
   <label class="fl">Amount (USD)<input id="oamt" type="number" min="0" value="${a.rate[1]}"></label>
   <label class="fl">Tie payment to stats, wins or school choice?<select id="ostat"><option value="no">No: paid for the promotion itself</option><option value="yes">Yes: bonus for touchdowns / wins</option></select></label>
   <div id="checks" class="checks"></div>
   <button class="btn pri" id="osend">Send offer</button></div></div></div>`;
  const run=()=>{
    const cat=$('#ocat').value,amt=+$('#oamt').value||0,perf=$('#ostat').value==='yes',fmv=a.rate[+$('#odel').value];
    const C=[
      [!BANNED.includes(cat),'Category allowed',BANNED.includes(cat)?cat+' is banned for college athletes under Texas law and most schools.':'No restricted categories.'],
      [!perf,'Paid for real promotion',perf?'Pay tied to performance or school choice is pay-for-play and gets flagged.':'Valid business purpose: payment is for the deliverables.'],
      [amt<=fmv*2.5,'Fair market value',amt>fmv*2.5?'This is far above this athlete\'s rate card ('+money(fmv)+'), which the clearinghouse may flag.':'In line with the athlete\'s rate card ('+money(fmv)+').'],
      [true,'Enrolled athlete',a.verified?'Enrollment verified by the school.':'Enrollment pending school verification.'],
      [true,amt>=600?'NIL Go report required':'NIL Go report',amt>=600?'Deals of $600+ must be reported. Next Level files it for the athlete in one tap.':'Under $600: no clearinghouse report needed.'],
      [true,'School disclosure','Sent to '+a.sch+' compliance before the athlete signs.']];
    $('#checks').innerHTML='<div class="lab">Compliance check</div>'+C.map(([ok,t,d])=>`<div class="ck ${ok?'ok':'bad'}">${ok?ic('chk',13):'✕'}<div><b>${t}</b><small>${d}</small></div></div>`).join('');
    $('#osend').disabled=C.some(c=>!c[0]);
  };
  ['#ocat','#odel','#ostat'].forEach(s=>$(s).onchange=()=>{if(s==='#odel')$('#oamt').value=a.rate[+$('#odel').value];run()});$('#oamt').oninput=run;run();
  $('#ox').onclick=()=>box.innerHTML='';
  $('#osend').onclick=()=>{if(a.live){NLAPI.offer(a,{cat:$('#ocat').value,del:+$('#odel').value,amt:+$('#oamt').value||0,perf:$('#ostat').value==='yes'}).then(()=>{box.innerHTML=`<div class="scrim"><div class="panel dlg"><div class="bd stack" style="text-align:center;gap:10px"><div class="big num" style="color:var(--accent)">Sent</div><p style="margin:0">Your offer to <b>${nm(a)}</b> passed every compliance check and is in their messages.</p><button class="btn pri" id="ok2" style="justify-self:center">Done</button></div></div></div>`;$('#ok2').onclick=()=>box.innerHTML=''}).catch(e=>toast(e.message));return}box.innerHTML=`<div class="scrim"><div class="panel dlg"><div class="bd stack" style="text-align:center;gap:10px"><div class="big num" style="color:var(--accent)">Sent</div><p style="margin:0">Your offer to <b>${nm(a)}</b> passed every compliance check and is in their inbox. Payment is held until the post goes live.</p><button class="btn pri" id="ok2" style="justify-self:center">Done</button></div></div></div>`;$('#ok2').onclick=()=>box.innerHTML=''};
}
function deals(){
  const a=(window.NLAPI&&NLAPI.meAthlete())||CA[1];
  const earned=OFFERS.filter(o=>o.status==='Paid').reduce((s,o)=>s+o.amt,0),pending=OFFERS.filter(o=>o.status!=='Paid').reduce((s,o)=>s+o.amt,0);
  $('#main').innerHTML=`<div class="ph"><div><div class="lab">NIL · athlete view</div><h1>My deals</h1><p>${nm(a)} · ${a.sp} · ${a.sch}</p></div><button class="btn pri" data-v="nil">See the brand side</button></div>
  <div class="nilstats">${[['Earned this year',money(earned)],['In progress',money(pending)],['Profile views (7 days)','1,284'],['Brand saves','37']].map(([l,v])=>`<div class="panel"><div class="bd"><div class="lab">${l}</div><div class="num big">${v}</div></div></div>`).join('')}</div>
  <section class="panel" style="margin-top:16px"><div class="hd"><h2>Open campaigns</h2><span class="lab">Matched to you</span></div><div class="bd">${campList(false)}</div></section>
  <div class="grid2" style="margin-top:16px"><section class="panel"><div class="hd"><h2>Offers & deals</h2></div><div class="bd stack" style="gap:12px">${OFFERS.map(o=>`<div class="deal"><div class="ath"><span class="ini">${o.brand.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><div style="min-width:0"><b>${o.brand}</b><small>${o.cat} · due ${o.due}</small></div><span class="chip ${o.status==='Offer'?'acc':''}" style="margin-left:auto">${o.status}</span></div>
    <p style="margin:8px 0">${o.what}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><b class="num big2">${money(o.amt)}</b>
    ${o.status==='Offer'?`<div style="display:flex;gap:8px"><button class="btn" data-dec="${o.id}">Decline</button><button class="btn pri" data-acc="${o.id}">Accept</button></div>`:`<div class="steps">${['Contract signed','School disclosure sent','Post live','Paid out'].map(s=>`<span class="${(o.done||[]).includes(s)?'on':''}">${s}</span>`).join('')}</div>`}</div>
    ${o.amt>=600&&o.status!=='Offer'?`<p class="note">${ic('shield',12)} NIL Go report: filed automatically</p>`:''}</div>`).join('')}</div></section>
  <div class="stack"><section class="panel"><div class="hd"><h2>Rate card</h2><button class="btn sm">Edit</button></div><div class="bd tl"><div><span>Story</span><p style="margin:0"><b class="num">${money(a.rate[0])}</b></p></div><div><span>Post / reel</span><p style="margin:0"><b class="num">${money(a.rate[1])}</b></p></div><div><span>Appearance</span><p style="margin:0"><b class="num">${money(a.rate[2])}</b></p></div></div></section>
  <section class="panel"><div class="hd"><h2>Open to</h2></div><div class="bd cats">${a.open.map(c=>`<span class="chip">${c}</span>`).join('')}</div><div class="bd" style="padding-top:0"><div class="lab" style="margin-bottom:6px">Always blocked</div><div class="cats">${BANNED.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></section>
  <section class="panel"><div class="hd"><h2>Compliance</h2></div><div class="bd tl"><div><span>Enrollment</span><p style="margin:0"><b>Verified by Harlan State</b></p></div><div><span>Disclosures</span><p style="margin:0"><b>All sent to compliance</b></p></div><div><span>NIL Go</span><p style="margin:0"><b>1 report filed</b></p></div></div></section></div></div>`;
  document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{if(window.NLAPI&&NLAPI.on){NLAPI.apply(+b.dataset.apply).then(render).catch(e=>toast(e.message));return}state.applied=[...(state.applied||[]),+b.dataset.apply];const c=CAMPS.find(x=>x.id===+b.dataset.apply);c.left=Math.max(0,c.left-1);deals()});
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{if(window.NLAPI&&NLAPI.on){NLAPI.respond(+b.dataset.acc,true).then(deals).catch(e=>toast(e.message));return}const o=OFFERS.find(x=>x.id===+b.dataset.acc);o.status='Active';o.done=['Contract signed','School disclosure sent'];deals()});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{if(window.NLAPI&&NLAPI.on){NLAPI.respond(+b.dataset.dec,false).then(deals).catch(e=>toast(e.message));return}const i=OFFERS.findIndex(x=>x.id===+b.dataset.dec);OFFERS.splice(i,1);deals()});
}

window.NL={NOTES,renderBell,A,CA,ME,LP,PH,DM,CAMPS,OFFERS,RC,BANNED,CATS,TC,state,render,renderNav,go,toast,who,nm};window.dispatchEvent(new Event('nl:ready'));
})();
